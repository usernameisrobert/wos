<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOS v2.5 - Dynamic Cloud Kernel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: #000;
            color: #00ff00;
            font-family: 'Consolas', 'Courier New', monospace;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* Setup Screen Overlay */
        #setupOverlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: white;
        }
        .setup-card {
            background: #111;
            padding: 40px;
            border-radius: 16px;
            width: 450px;
            border: 1px solid #333;
            text-align: center;
        }
        .storage-option {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 12px;
            margin-top: 15px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            text-align: left;
        }
        .storage-option:hover { border-color: #00ff00; background: #222; }

        /* Graphics Mode Container */
        #displayContainer {
            display: none;
            width: 100vw;
            height: 100vh;
            background: #000;
        }
        #systemCanvas {
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
            cursor: none;
        }

        /* Terminal View */
        #terminalView { 
            position: fixed;
            inset: 0;
            padding: 20px; 
            overflow-y: auto; 
            display: none; 
            background: #000;
        }
        #inputLine { display: flex; align-items: center; margin-top: 10px; }
        #termInput {
            background: transparent; border: none; outline: none;
            color: #00ff00; flex: 1; margin-left: 8px;
            font-family: inherit; font-size: 16px;
        }
        .log-entry { margin-bottom: 2px; line-height: 1.4; }
    </style>
</head>
<body>

    <!-- BIOS SETUP SCREEN -->
    <div id="setupOverlay">
        <div class="setup-card">
            <h1 class="text-2xl font-bold mb-2">WOS Boot Manager</h1>
            <p class="text-slate-400 text-sm mb-6">Storage Architecture Setup</p>
            
            <div class="storage-option" id="btn-file">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">💾</span>
                    <div>
                        <div class="font-semibold text-green-500">File-Based (Hardware API)</div>
                        <div class="text-xs text-slate-400">Creates/Opens a physical file on your PC.</div>
                    </div>
                </div>
            </div>

            <div class="storage-option" onclick="initializeStorage('local')">
                <div class="flex items-center gap-3">
                    <span class="text-2xl">☁️</span>
                    <div>
                        <div class="font-semibold text-amber-500">LocalData (Virtual)</div>
                        <div class="text-xs text-slate-400">Uses browser-managed temporary memory.</div>
                    </div>
                </div>
            </div>
            
            <div id="setup-status" class="mt-4 text-xs text-slate-500 italic">Waiting for user...</div>
        </div>
    </div>

    <div id="terminalView">
        <div id="logArea"></div>
        <div id="inputLine">
            <span>root@wos:~#</span>
            <input type="text" id="termInput" autofocus autocomplete="off">
        </div>
    </div>

    <div id="displayContainer">
        <canvas id="systemCanvas"></canvas>
    </div>

    <script>
        class WOSKernel {
            constructor() {
                this.memory = new WebAssembly.Memory({ initial: 512 });
                this.memView = new DataView(this.memory.buffer);
                this.mode = 0; // 0: Term, 1: Gfx
                this.input = { x: 0, y: 0, b: 0 };
                this.vram = null;
                this.ctx = null;
                this.fileHandle = null;
                this.programs = []; // List of remote binaries
                
                this.setupImports();
                this.initGraphics();
            }

            initGraphics() {
                const canvas = document.getElementById('systemCanvas');
                this.ctx = canvas.getContext('2d', { alpha: false });
                
                const resize = () => {
                    canvas.width = window.innerWidth / 2;
                    canvas.height = window.innerHeight / 2;
                    this.vram = this.ctx.createImageData(canvas.width, canvas.height);
                };
                window.addEventListener('resize', resize);
                resize();

                window.addEventListener('mousemove', e => {
                    this.input.x = (e.clientX / window.innerWidth) * canvas.width;
                    this.input.y = (e.clientY / window.innerHeight) * canvas.height;
                });
                window.addEventListener('mousedown', () => this.input.b = 1);
                window.addEventListener('mouseup', () => this.input.b = 0);
            }

            setupImports() {
                this.imports = {
                    env: {
                        memory: this.memory,
                        gpu_draw_pixel: (x, y, r, g, b) => {
                            if (!this.vram) return;
                            const idx = (Math.floor(y) * this.vram.width + Math.floor(x)) * 4;
                            if (idx < 0 || idx >= this.vram.data.length) return;
                            this.vram.data[idx] = r; this.vram.data[idx+1] = g; this.vram.data[idx+2] = b; this.vram.data[idx+3] = 255;
                        },
                        gpu_clear: (r, g, b) => {
                            for(let i=0; i<this.vram.data.length; i+=4) {
                                this.vram.data[i] = r; this.vram.data[i+1] = g; this.vram.data[i+2] = b; this.vram.data[i+3] = 255;
                            }
                        },
                        get_input_x: () => this.input.x,
                        get_input_y: () => this.input.y,
                        get_input_button: () => this.input.b,
                        set_mode: (m) => {
                            this.mode = m;
                            document.getElementById('terminalView').style.display = m === 0 ? 'block' : 'none';
                            document.getElementById('displayContainer').style.display = m === 1 ? 'block' : 'none';
                        },
                        print: (ptr) => {
                            const bytes = new Uint8Array(this.memory.buffer, ptr);
                            let str = "";
                            for(let i=0; bytes[i] !== 0; i++) str += String.fromCharCode(bytes[i]);
                            terminalLog(str);
                        }
                    }
                };
            }

            async fetchProgramList() {
                try {
                    // Simulating the /programs manifest
                    this.programs = [
                        { name: 'desktop.wasm', path: '/programs/desktop.wasm', graphics: true },
                        { name: 'clock.wasm', path: '/programs/clock.wasm', graphics: false },
                        { name: 'calc.wasm', path: '/programs/calc.wasm', graphics: true }
                    ];
                    return true;
                } catch (e) {
                    return false;
                }
            }

            async mountFileSystem() {
                try {
                    // Check if the API is supported
                    if (!('showSaveFilePicker' in window)) {
                        throw new Error("File System Access API not supported in this browser.");
                    }

                    // Request the user to create/select a file
                    const handle = await window.showSaveFilePicker({
                        suggestedName: 'drive_c.wos_drive',
                        types: [{
                            description: 'WOS Virtual Disk',
                            accept: {'application/octet-stream': ['.wos_drive']}
                        }],
                    });

                    this.fileHandle = handle;

                    // Immediately test write access and create the file physically
                    const writable = await handle.createWritable();
                    const initData = new TextEncoder().encode("WOS_FS_V1");
                    await writable.write(initData);
                    await writable.close();

                    console.log("File system mounted successfully:", handle.name);
                    return true;
                } catch (e) {
                    console.error("Hardware File System Error:", e);
                    terminalLog(`FS ERROR: ${e.message}`, 'red');
                    return false;
                }
            }

            async boot(storage) {
                const status = document.getElementById('setup-status');
                
                if (storage === 'file') {
                    status.innerText = "Requesting Hardware Access...";
                    const success = await this.mountFileSystem();
                    if (!success) {
                        status.innerText = "Access Denied or Not Supported.";
                        return;
                    }
                }

                status.innerText = "Fetching Cloud Binaries...";
                await this.fetchProgramList();

                document.getElementById('setupOverlay').style.display = 'none';
                document.getElementById('terminalView').style.display = 'block';
                
                terminalLog(`[[ WOS KERNEL v2.5 BOOTED ]]`);
                terminalLog(`Storage: ${storage.toUpperCase()}`);
                if (storage === 'file') terminalLog(`Mounted: ${this.fileHandle.name}`);
                terminalLog(`Programs indexed: ${this.programs.map(p => p.name).join(', ')}`);
                terminalLog("Ready. Type 'run desktop.wasm'");
            }

            async loadAndRun(filename) {
                const prog = this.programs.find(p => p.name === filename);
                if (!prog) {
                    terminalLog(`error: ${filename} not found in /programs manifest`, 'red');
                    return;
                }

                terminalLog(`Fetching ${prog.path}...`);
                
                try {
                    // Logic to fetch and instantiate would go here.
                    if (prog.graphics) this.imports.env.set_mode(1);
                    
                    if (filename === 'desktop.wasm') {
                        this.startGraphicsLoop();
                    } else {
                        terminalLog(`Program ${filename} initialized.`);
                    }
                } catch (e) {
                    terminalLog(`Load error: ${e.message}`, 'red');
                }
            }

            startGraphicsLoop() {
                const render = () => {
                    if (this.mode !== 1) return;
                    
                    this.imports.env.gpu_clear(10, 10, 20);

                    for(let x=0; x<this.vram.width; x+=20) {
                        for(let y=0; y<this.vram.height; y+=20) {
                            this.imports.env.gpu_draw_pixel(x, y, 30, 30, 50);
                        }
                    }

                    this.programs.forEach((p, i) => {
                        this.drawRect(20 + (i*50), 20, 30, 30, 0, 150, 255);
                    });

                    this.drawRect(this.input.x, this.input.y, 3, 3, 0, 255, 0);

                    this.ctx.putImageData(this.vram, 0, 0);
                    requestAnimationFrame(render);
                };
                render();
            }

            drawRect(x, y, w, h, r, g, b) {
                for(let ix = Math.floor(x); ix < x+w; ix++) {
                    for(let iy = Math.floor(y); iy < y+h; iy++) {
                        this.imports.env.gpu_draw_pixel(ix, iy, r, g, b);
                    }
                }
            }
        }

        const kernel = new WOSKernel();

        document.getElementById('btn-file').onclick = () => kernel.boot('file');
        
        function initializeStorage(type) {
            kernel.boot(type);
        }

        function terminalLog(msg, color = '#00ff00') {
            const log = document.getElementById('logArea');
            if (!log) return;
            log.innerHTML += `<div class="log-entry" style="color: ${color}">${msg}</div>`;
            document.getElementById('terminalView').scrollTop = 9999;
        }

        document.getElementById('termInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                const val = e.target.value;
                terminalLog(`root@wos:~# ${val}`, '#888');
                if (val.startsWith('run ')) kernel.loadAndRun(val.split(' ')[1]);
                else if (val === 'ls') terminalLog(kernel.programs.map(p => p.name).join('  '));
                else if (val === 'clear') document.getElementById('logArea').innerHTML = '';
                else if (val !== '') terminalLog(`command not found: ${val}`, 'red');
                e.target.value = '';
            }
        });
    </script>
</body>
</html>
