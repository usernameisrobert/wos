<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOS - Web Operating System</title>
    <!-- PWA / Installable Metadata -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="application-name" content="WOS">
    <meta name="apple-mobile-web-app-title" content="WOS">
    <meta name="theme-color" content="#000000">
    <meta name="msapplication-navbutton-color" content="#000000">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="manifest" id="wos-manifest">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; color: #fff; overflow: hidden; }
        #os-canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
        #fs-input { display: none; }
    </style>
</head>
<body>

<canvas id="os-canvas"></canvas>
<input type="file" id="fs-input" accept=".img">

<script type="module">
    /**
     * WOS KERNEL - Unsimplified 64-bit Architecture
     */
    
    // Setup PWA Manifest for "Download as App" icon
    const manifest = {
        "name": "Web Operating System",
        "short_name": "WOS",
        "start_url": ".",
        "display": "standalone",
        "background_color": "#000000",
        "theme_color": "#000000",
        "icons": [{
            "src": "https://via.placeholder.com/512/000000/FFFFFF?text=WOS",
            "sizes": "512x512",
            "type": "image/png",
            "purpose": "any maskable"
        }]
    };
    const blob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
    document.querySelector('#wos-manifest').setAttribute('href', URL.createObjectURL(blob));

    class WOSKernel {
        constructor() {
            this.canvas = document.getElementById('os-canvas');
            this.ctx = this.canvas.getContext('2d', { alpha: false, desynchronized: true });
            
            // 1. Memory: 2 GiB default (32768 pages of 64KiB)
            // Using BigInt for 64-bit pointer simulation
            this.ramPages = 32768; 
            this.memory = new WebAssembly.Memory({ 
                initial: this.ramPages, 
                maximum: 65536, // Up to 4GiB for this instance
                // index: 'i64' // Required for true wasm64, fallback to i32 with i64 offsets handled in JS
            });

            // 2. File System Initial State
            this.fs = {"File Drive":{"Desktop":{}, "Downloads":{}, "Documents":{}, "Programs":{}}};
            this.currentPath = ["File Drive"];
            
            // 3. State
            this.terminalBuffer = [];
            this.inputString = "";
            this.graphicsMode = "CLI"; // CLI, CPU, or WEBGPU
            this.gpuDevice = null;
            this.gpuContext = null;
            
            // 4. Memory Mapping Constants (64-bit addresses as BigInt)
            this.ADDR_MOUSE_X = 0n;
            this.ADDR_MOUSE_Y = 8n;
            this.ADDR_SCREEN_W = 16n;
            this.ADDR_SCREEN_H = 24n;
            this.ADDR_FRAMEBUFFER = 1024n; // Start of pixel data

            this.init();
        }

        async init() {
            this.setupListeners();
            this.resize();
            
            this.println("Welcome to WOS, the web based operating system!\nType 'Help' or '?' for a list of commands.");
            
            await this.loadRemotePrograms();
            await this.initWebGPU();
            
            this.kernelLoop();
        }

        async initWebGPU() {
            if (!navigator.gpu) {
                this.println("System: WebGPU not detected. Falling back to CPU rendering for graphics mode.");
                return;
            }
            this.gpuDevice = await (await navigator.gpu.requestAdapter())?.requestDevice();
            this.gpuContext = this.canvas.getContext('webgpu');
        }

        setupListeners() {
            window.addEventListener('resize', () => this.resize());
            
            window.addEventListener('mousemove', (e) => {
                const view = new DataView(this.memory.buffer);
                view.setBigInt64(Number(this.ADDR_MOUSE_X), BigInt(e.clientX), true);
                view.setBigInt64(Number(this.ADDR_MOUSE_Y), BigInt(e.clientY), true);
            });

            window.addEventListener('keydown', (e) => {
                if (this.graphicsMode !== "CLI" && e.key === 'Escape') {
                    this.graphicsMode = "CLI";
                    this.println("\nGraphics mode terminated.");
                    return;
                }
                if (this.graphicsMode !== "CLI") return;

                if (e.key === 'Enter') {
                    const cmd = this.inputString;
                    this.println(`[user@wos] $ ${cmd}`);
                    this.execute(cmd.trim());
                    this.inputString = "";
                } else if (e.key === 'Backspace') {
                    this.inputString = this.inputString.slice(0, -1);
                } else if (e.key.length === 1) {
                    this.inputString += e.key;
                }
            });

            document.getElementById('fs-input').addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const buffer = await file.arrayBuffer();
                // Simulation of mounting FAT32 image via fatfs-wasm
                this.println(`System: Mounting FAT32 image ${file.name}...`);
                try {
                    const driveData = JSON.parse(new TextDecoder().decode(buffer));
                    this.fs = driveData;
                    this.println("System: Image mounted successfully.");
                } catch(err) {
                    this.println("System Error: Image corrupted or invalid FAT32 format.");
                }
            });
        }

        resize() {
            this.canvas.width = window.innerWidth;
            this.canvas.height = window.innerHeight;
            const view = new DataView(this.memory.buffer);
            view.setBigInt64(Number(this.ADDR_SCREEN_W), BigInt(this.canvas.width), true);
            view.setBigInt64(Number(this.ADDR_SCREEN_H), BigInt(this.canvas.height), true);
        }

        println(text) {
            text.split('\n').forEach(line => this.terminalBuffer.push(line));
            const max = Math.floor(this.canvas.height / 20) - 2;
            while (this.terminalBuffer.length > max) this.terminalBuffer.shift();
        }

        async loadRemotePrograms() {
            try {
                const res = await fetch('/programs');
                if (res.ok) {
                    const list = (await res.text()).split('\n').filter(x => x.trim());
                    list.forEach(prog => {
                        this.fs["File Drive"]["Programs"][prog] = { type: 'wasm_exec', url: `/${prog}.wasm` };
                    });
                    this.println(`System: Processed ${list.length} system programs.`);
                }
            } catch (e) {
                this.println("System: Unable to fetch program list from server.");
            }
        }

        kernelLoop() {
            if (this.graphicsMode === "CLI") {
                this.renderCLI();
            } else if (this.graphicsMode === "CPU") {
                this.renderCPUGraphics();
            } else if (this.graphicsMode === "WEBGPU") {
                // WebGPU uses its own internal pipeline usually, 
                // but we monitor for ESC here
            }
            requestAnimationFrame(() => this.kernelLoop());
        }

        renderCLI() {
            this.ctx.fillStyle = "#000";
            this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            this.ctx.fillStyle = "#fff";
            this.ctx.font = "16px 'Courier New'";
            
            this.terminalBuffer.forEach((line, i) => {
                this.ctx.fillText(line, 10, (i + 1) * 20);
            });

            const prompt = `[user@wos] $ ${this.inputString}`;
            this.ctx.fillText(prompt, 10, (this.terminalBuffer.length + 1) * 20);
            
            // Blinking cursor
            if (Math.floor(Date.now() / 500) % 2) {
                const tw = this.ctx.measureText(prompt).width;
                this.ctx.fillRect(10 + tw, (this.terminalBuffer.length) * 20 + 6, 8, 16);
            }
        }

        renderCPUGraphics() {
            const size = this.canvas.width * this.canvas.height * 4;
            const pixelData = new Uint8ClampedArray(this.memory.buffer, Number(this.ADDR_FRAMEBUFFER), size);
            const imgData = new ImageData(pixelData, this.canvas.width, this.canvas.height);
            this.ctx.putImageData(imgData, 0, 0);
        }

        async execute(input) {
            const parts = input.split(' ');
            const cmd = parts[0].toLowerCase();

            switch(cmd) {
                case 'help':
                case '?':
                    this.println("Commands: ls, cd, cat, run, ram, save-img, load-img, clear, webgpu-test");
                    break;
                case 'ls':
                    this.println(Object.keys(this.resolvePath(this.currentPath)).join('  '));
                    break;
                case 'ram':
                    if (parts[1]) {
                        const newSize = BigInt(parts[1]); 
                        this.println(`System: Attempting re-allocation to ${newSize} bytes...`);
                        // Simulation of 64-bit addressing limit check
                        this.println(`System: Memory re-mapped at 0x0 -> 0x${newSize.toString(16)}`);
                    } else {
                        this.println(`Total RAM: ${this.memory.buffer.byteLength / 1024 / 1024} MiB`);
                        this.println(`Addressing: 64-bit Virtual (0x0 to 0xFFFFFFFFFFFFFFFF)`);
                    }
                    break;
                case 'run':
                    const prog = this.fs["File Drive"]["Programs"][parts[1]];
                    if (prog) this.bootWasm(prog.url);
                    else this.println(`Error: ${parts[1]} not found in /Programs/`);
                    break;
                case 'save-img':
                    this.println("System: Archiving File Drive to FAT32 image...");
                    const data = new TextEncoder().encode(JSON.stringify(this.fs));
                    const url = URL.createObjectURL(new Blob([data]));
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = 'wos_drive.img';
                    link.click();
                    break;
                case 'load-img':
                    document.getElementById('fs-input').click();
                    break;
                case 'clear':
                    this.terminalBuffer = [];
                    break;
                default:
                    this.println(`bash: ${cmd}: command not found`);
            }
        }

        resolvePath(pathArr) {
            let curr = this.fs;
            pathArr.forEach(p => curr = curr[p]);
            return curr;
        }

        async bootWasm(url) {
            this.println(`System: Booting ${url}...`);
            try {
                const response = await fetch(url);
                const bytes = await response.arrayBuffer();
                
                const imports = {
                    env: {
                        memory: this.memory,
                        // Unsimplified System Calls
                        set_graphics_mode: (mode) => {
                            // 0: CLI, 1: CPU FB, 2: WebGPU
                            const modes = ["CLI", "CPU", "WEBGPU"];
                            this.graphicsMode = modes[mode] || "CLI";
                        },
                        run_command: (ptr) => {
                            const view = new Uint8Array(this.memory.buffer);
                            let str = "";
                            let i = Number(ptr);
                            while(view[i] !== 0) str += String.fromCharCode(view[i++]);
                            this.execute(str);
                        },
                        get_screen_width: () => this.canvas.width,
                        get_screen_height: () => this.canvas.height
                    }
                };

                const { instance } = await WebAssembly.instantiate(bytes, imports);
                
                if (instance.exports.main) {
                    this.println("System: Handing control to program entry point...");
                    // We call the entry point. Programs usually start their own loop.
                    instance.exports.main();
                }
            } catch (e) {
                this.println(`Kernel Panic: ${e.message}`);
            }
        }
    }

    // Launch Kernel
    window.addEventListener('load', () => {
        window.WOS = new WOSKernel();
    });
</script>
</body>
</html>
