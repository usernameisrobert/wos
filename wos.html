<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOS - Web Operating System</title>
    <!-- PWA Metadata for Installability -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="manifest" id="manifest-placeholder">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }
        #terminal-canvas {
            display: block;
            image-rendering: pixelated;
        }
        #hidden-upload {
            display: none;
        }
    </style>
</head>
<body>

<canvas id="terminal-canvas"></canvas>
<input type="file" id="hidden-upload" accept=".img">

<script>
    /**
     * WOS KERNEL & INITIALIZATION
     */
    
    // Create PWA Manifest dynamically to ensure installability
    const manifest = {
        "name": "Web Operating System",
        "short_name": "WOS",
        "start_url": ".",
        "display": "standalone",
        "background_color": "#000000",
        "theme_color": "#000000",
        "icons": [
            {
                "src": "https://via.placeholder.com/192/000000/FFFFFF?text=WOS",
                "sizes": "192x192",
                "type": "image/png"
            }
        ]
    };
    const stringManifest = JSON.stringify(manifest);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    document.querySelector('#manifest-placeholder').setAttribute('href', manifestURL);

    // Configuration
    const CONFIG = {
        DEFAULT_RAM: 2 * 1024 * 1024 * 1024, // 2 GiB
        FS_ROOT: {"File Drive":{"Desktop":{}, "Downloads":{}, "Documents":{}, "Programs":{}}},
        COLORS: {
            bg: '#000000',
            text: '#ffffff',
            cursor: '#00ff00'
        },
        FONT_SIZE: 16
    };

    class WOSKernel {
        constructor() {
            this.canvas = document.getElementById('terminal-canvas');
            this.ctx = this.canvas.getContext('2d');
            this.buffer = [];
            this.currentInput = "";
            this.ramSize = CONFIG.DEFAULT_RAM;
            this.memory = null; // To be initialized as SharedArrayBuffer if available
            this.fs = CONFIG.FS_ROOT;
            this.cursorPos = { x: 0, y: 0 };
            this.charWidth = 10;
            this.charHeight = 20;
            this.graphicsMode = false;
            
            this.init();
        }

        async init() {
            this.resize();
            window.addEventListener('resize', () => this.resize());
            window.addEventListener('keydown', (e) => this.handleKey(e));
            
            this.println("Welcome to WOS, the web based operating system!");
            this.println("Type 'Help' or '?' for a list of commands.\n");
            
            await this.loadPrograms();
            this.draw();
        }

        async loadPrograms() {
            try {
                this.println("Initializing system storage...");
                const response = await fetch('/programs');
                if (response.ok) {
                    const text = await response.text();
                    const apps = text.split('\n').filter(line => line.trim());
                    apps.forEach(app => {
                        this.fs["File Drive"]["Programs"][app] = { type: 'wasm_link', url: `/${app}.wasm` };
                    });
                    this.println(`Loaded ${apps.length} programs into /Programs/`);
                }
            } catch (e) {
                this.println("Warning: Could not reach backend for /programs list.");
            }
            this.renderPrompt();
        }

        resize() {
            this.canvas.width = window.innerWidth;
            this.canvas.height = window.innerHeight;
            this.ctx.font = `${CONFIG.FONT_SIZE}px 'Courier New'`;
            this.charWidth = this.ctx.measureText('A').width;
            this.charHeight = CONFIG.FONT_SIZE + 4;
            this.draw();
        }

        println(text) {
            const lines = text.split('\n');
            lines.forEach(line => this.buffer.push(line));
            if (this.buffer.length > (this.canvas.height / this.charHeight) - 2) {
                this.buffer.shift();
            }
            this.draw();
        }

        draw() {
            if (this.graphicsMode) return;
            this.ctx.fillStyle = CONFIG.COLORS.bg;
            this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            
            this.ctx.fillStyle = CONFIG.COLORS.text;
            this.ctx.font = `${CONFIG.FONT_SIZE}px 'Courier New'`;
            
            this.buffer.forEach((line, i) => {
                this.ctx.fillText(line, 10, (i + 1) * this.charHeight);
            });

            const inputY = (this.buffer.length + 1) * this.charHeight;
            this.ctx.fillText("> " + this.currentInput, 10, inputY);
            
            // Draw Cursor
            const cursorX = 10 + this.ctx.measureText("> " + this.currentInput).width;
            if (Date.now() % 1000 < 500) {
                this.ctx.fillRect(cursorX, inputY - CONFIG.FONT_SIZE, 8, CONFIG.FONT_SIZE);
            }
            
            requestAnimationFrame(() => this.draw());
        }

        handleKey(e) {
            if (this.graphicsMode && e.key === 'Escape') {
                this.exitGraphics();
                return;
            }

            if (e.key === 'Enter') {
                const cmd = this.currentInput.trim();
                this.println("> " + this.currentInput);
                this.executeCommand(cmd);
                this.currentInput = "";
            } else if (e.key === 'Backspace') {
                this.currentInput = this.currentInput.slice(0, -1);
            } else if (e.key.length === 1) {
                this.currentInput += e.key;
            }
        }

        executeCommand(input) {
            const parts = input.toLowerCase().split(' ');
            const cmd = parts[0];

            switch(cmd) {
                case 'help':
                case '?':
                    this.println("Available commands: HELP, LS, RAM, RUN [prog], EXPORT-IMG, IMPORT-IMG, CLEAR, RESET-RAM");
                    break;
                case 'ls':
                    this.println("Directory: /");
                    this.println(Object.keys(this.fs["File Drive"]).join('  '));
                    break;
                case 'ram':
                    this.println(`Current RAM allocation: ${(this.ramSize / 1024 / 1024).toFixed(2)} MiB`);
                    this.println(`Addressing mode: 64-bit Virtual`);
                    break;
                case 'reset-ram':
                    const newRam = parseInt(parts[1]);
                    if (!isNaN(newRam)) {
                        this.ramSize = newRam * 1024 * 1024;
                        this.println(`RAM updated to ${newRam} MiB.`);
                    } else {
                        this.println("Usage: reset-ram [size_in_mib]");
                    }
                    break;
                case 'clear':
                    this.buffer = [];
                    break;
                case 'export-img':
                    this.exportFileSystem();
                    break;
                case 'import-img':
                    document.getElementById('hidden-upload').click();
                    break;
                case 'run':
                    this.runProgram(parts[1]);
                    break;
                default:
                    this.println(`Unknown command: ${cmd}`);
            }
        }

        async runProgram(name) {
            if (!name) return this.println("Usage: run [program_name]");
            
            this.println(`Loading ${name}.wasm...`);
            try {
                // In a real scenario, we use WebAssembly.instantiateStreaming
                // Here we simulate the logic for your wasm interface
                const response = await fetch(`/${name}.wasm`);
                if (!response.ok) throw new Error("File not found");
                
                this.println(`Executing ${name}... (Simulated RAM access)`);
                
                // Initialize WASM Memory with 64-bit support if browser allows (memory64 proposal)
                // Defaulting to large buffer simulation
                const wasmMemory = new WebAssembly.Memory({
                    initial: 256, // 16MB initial
                    maximum: 65536, // 4GB max if 32-bit, or use memory64
                    // index: 'i64' // Experimental 64-bit
                });

                this.println(`Successfully allocated virtual addressing space.`);
                this.println(`[Program ${name} running in background environment]`);

            } catch (e) {
                this.println(`Error: Could not run ${name}. ${e.message}`);
            }
        }

        exportFileSystem() {
            this.println("Generating FAT32 image...");
            const data = JSON.stringify(this.fs);
            const blob = new Blob([data], {type: 'application/octet-stream'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'wos_drive.img';
            a.click();
            this.println("Download started.");
        }

        enterGraphics() {
            this.graphicsMode = true;
            this.println("Entering Graphics Mode (WebGPU/Canvas)... Press ESC to exit.");
        }

        exitGraphics() {
            this.graphicsMode = false;
            this.println("Returned to CLI mode.");
        }

        renderPrompt() {
            // Internal state management
        }
    }

    // Initialize the OS
    window.onload = () => {
        const kernel = new WOSKernel();

        // Handle file uploads for Persistent Storage
        document.getElementById('hidden-upload').onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function() {
                try {
                    // In real FAT32 usage, we'd mount the binary buffer here
                    const content = JSON.parse(new TextDecoder().decode(this.result));
                    kernel.fs = content;
                    kernel.println("FileSystem successfully mounted from image.");
                } catch (err) {
                    kernel.println("Error: Invalid .img file format.");
                }
            };
            reader.readAsArrayBuffer(file);
        };
    };

</script>
</body>
</html>
